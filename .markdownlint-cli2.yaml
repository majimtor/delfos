# Markdown lint configuration, shared by CI and local runs of markdownlint-cli2.
config:
  # Tables are exempt from the 80-column limit; prose and code are not.
  MD013:
    tables: false
ignores:
  # Pull request templates start at the second heading level by convention.
  - .github/pull_request_template.md
  # Written by release-please from the commit history; its layout is not ours to change.
  - CHANGELOG.md
  - "**/node_modules/**"
