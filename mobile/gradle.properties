org.gradle.configuration-cache=true
org.gradle.caching=true
kotlin.code.style=official
# The Android, Compose and Kotlin/Native plugins exhaust Gradle's default 384 MB of metaspace.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g
android.useAndroidX=true
# The included shared module builds its Android and iOS targets for this build.
delfos.android=true
delfos.ios=true
