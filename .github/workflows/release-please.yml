name: Release

# Keeps a release pull request open with the changelog and the next version computed from the
# Conventional Commits on main, tags the version when that pull request merges (ADR 0013), and
# attaches the Android application to the release it creates.
on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    name: Release pull request and tag
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # A token of the maintainer, so that the release pull request gets its checks; a pull
          # request opened with the workflow token triggers none and would have to be closed and
          # reopened by hand.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}

  apk:
    name: Android application on the release
    needs: [release-please]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Build the release APK
        # Signed with the debug key of the runner on purpose; see docs/known-issues.md.
        run: ./gradlew -p mobile :androidApp:assembleRelease --no-daemon --console=plain
      - name: Attach the APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          cp mobile/androidApp/build/outputs/apk/release/androidApp-release.apk "delfos-${TAG}.apk"
          gh release upload "$TAG" "delfos-${TAG}.apk" --clobber
