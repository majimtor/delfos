name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks
        # Same version as the local pre-commit hook; checksum from the release.
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          rm gitleaks.tar.gz
      - name: Scan the full history
        run: ./gitleaks git --redact --no-banner --exit-code 1 .

  contract:
    name: Contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Lint the OpenAPI document
        run: npx --yes @redocly/cli@2.77.0 lint contract/openapi.yaml
      - name: Check that the conformance files are valid JSON
        run: |
          for f in contract/conformance/*.json; do
            jq -e . "$f" > /dev/null || { echo "$f is not valid JSON"; exit 1; }
          done
      - name: Extract the contract of the base branch
        if: github.event_name == 'pull_request'
        id: base
        run: |
          if git show "origin/${{ github.base_ref }}:contract/openapi.yaml" > base-openapi.yaml 2>/dev/null; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "No contract on the base branch; skipping the breaking-change check."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check whether the contract changelog changed
        if: github.event_name == 'pull_request' && steps.base.outputs.present == 'true'
        id: changelog
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qx 'contract/CHANGELOG.md'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Detect breaking changes against the base branch
        # Until the first release a breaking change is allowed when the
        # changelog records it; without an entry the check fails. After the
        # release this becomes an unconditional failure.
        if: github.event_name == 'pull_request' && steps.base.outputs.present == 'true'
        uses: oasdiff/oasdiff-action/breaking@8a211b41745fcecdfa4a86531ffbf08934fb14f6 # v0.1.23
        with:
          base: base-openapi.yaml
          revision: contract/openapi.yaml
          fail-on: ${{ steps.changelog.outputs.changed != 'true' && 'ERR' || '' }}
          review: false

  shared:
    name: Shared module
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Build and test on the JVM and Android
        # The Android SDK of the runner image serves the Android target; iOS needs macOS, below.
        run: ./gradlew -p shared check -Pdelfos.android=true --no-daemon --console=plain

  ios:
    name: Shared module on iOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Run the conformance suite on the iOS simulator
        # Apple silicon runner: the simulator test runs here and is skipped on Intel hosts.
        run: ./gradlew -p shared iosSimulatorArm64Test -Pdelfos.ios=true --no-daemon --console=plain

  mobile-ios:
    name: Mobile app on iOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Build the application for the iOS simulator
        # Xcode runs the Gradle task that links the Kotlin framework; no signing, no distribution (ADR 0005).
        run: >-
          xcodebuild -project mobile/iosApp/iosApp.xcodeproj -target iosApp -sdk iphonesimulator
          -configuration Debug CODE_SIGNING_ALLOWED=NO build

  mobile:
    name: Mobile app
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Run the host tests and build the debug APK
        # The Android SDK of the runner image serves the build; the APK talks to the public API.
        run: ./gradlew -p mobile :app:testAndroidHostTest :androidApp:assembleDebug --no-daemon --console=plain
      - name: Keep the debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: delfos-debug-apk
          path: mobile/androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  api:
    name: API module
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Build and test against PostgreSQL in a container
        run: ./gradlew -p api check --no-daemon --console=plain

  image:
    name: Container image
    runs-on: ubuntu-24.04
    needs: [api]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the image
        run: docker build --file deploy/Dockerfile --tag ghcr.io/${{ github.repository }}-api:${{ github.sha }} .
      - name: Push the image from main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
          docker tag ghcr.io/${{ github.repository }}-api:${{ github.sha }} ghcr.io/${{ github.repository }}-api:main
          docker push ghcr.io/${{ github.repository }}-api:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}-api:main

  web:
    name: Web client
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Lint, format, messages, tests and build
        run: npm run check

  web-deploy:
    name: Web deploy
    runs-on: ubuntu-24.04
    # Deploys the Worker declared in web/wrangler.jsonc from main, after every check.
    needs: [secrets, contract, shared, api, web, docs]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: web-deploy
      cancel-in-progress: false
    environment:
      name: production
      url: https://delfos.manuelalejandro.com
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Build against the public API
        env:
          VITE_API_BASE_URL: https://api.delfos.manuelalejandro.com
        run: npm run build
      - name: Deploy the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.160.0 deploy

  e2e:
    name: End-to-end path
    runs-on: ubuntu-24.04
    # The stranger's path through the built web against a locally seeded API, with axe on every
    # page. PostgreSQL runs as a service container; the API runs from its boot jar.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: delfos
          POSTGRES_USER: delfos
          POSTGRES_PASSWORD: delfos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U delfos -d delfos"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Build the API
        run: ./gradlew -p api bootJar --no-daemon --console=plain
      - name: Start the API with the demo seed
        env:
          DELFOS_DB_URL: jdbc:postgresql://localhost:5432/delfos
          DELFOS_DB_USERNAME: delfos
          DELFOS_DB_PASSWORD: delfos
          DELFOS_SEED_ENABLED: "true"
          DELFOS_SEED_RESET_TOKEN: e2e-reset-token
          DELFOS_WEB_ORIGIN: http://localhost:5173
        run: |
          java -jar "$(ls api/build/libs/api-*.jar | grep -v plain)" > api.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/actuator/health/readiness > /dev/null && exit 0
            sleep 2
          done
          echo "The API did not become ready"; tail -50 api.log; exit 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: web
      - name: Build the web
        run: npm run build
        working-directory: web
      - name: Run the end-to-end path
        run: npm run e2e
        working-directory: web
      - name: Keep the report and the API log
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: end-to-end
          path: |
            web/playwright-report
            web/test-results
            api.log
          if-no-files-found: ignore

  docs:
    name: Markdown lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: "**/*.md"
