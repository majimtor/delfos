name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks
        # Same version as the local pre-commit hook; checksum from the release.
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          rm gitleaks.tar.gz
      - name: Scan the full history
        run: ./gitleaks git --redact --no-banner --exit-code 1 .

  contract:
    name: Contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - name: Lint the OpenAPI document
        run: npx --yes @redocly/cli@2.77.0 lint contract/openapi.yaml
      - name: Check that the conformance files are valid JSON
        run: |
          for f in contract/conformance/*.json; do
            jq -e . "$f" > /dev/null || { echo "$f is not valid JSON"; exit 1; }
          done
      - name: Extract the contract of the base branch
        if: github.event_name == 'pull_request'
        id: base
        run: |
          if git show "origin/${{ github.base_ref }}:contract/openapi.yaml" > base-openapi.yaml 2>/dev/null; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "No contract on the base branch; skipping the breaking-change check."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check whether the contract changelog changed
        if: github.event_name == 'pull_request' && steps.base.outputs.present == 'true'
        id: changelog
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -qx 'contract/CHANGELOG.md'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Detect breaking changes against the base branch
        # Until the first release a breaking change is allowed when the
        # changelog records it; without an entry the check fails. After the
        # release this becomes an unconditional failure.
        if: github.event_name == 'pull_request' && steps.base.outputs.present == 'true'
        uses: oasdiff/oasdiff-action/breaking@8a211b41745fcecdfa4a86531ffbf08934fb14f6 # v0.1.23
        with:
          base: base-openapi.yaml
          revision: contract/openapi.yaml
          fail-on: ${{ steps.changelog.outputs.changed != 'true' && 'ERR' || '' }}
          review: false

  docs:
    name: Markdown lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: "**/*.md"
