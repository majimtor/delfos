# Single place for JVM tool and dependency versions, shared by every Gradle build in the repository.
[versions]
kotlin = "2.4.21"
kotlinx-serialization = "1.12.0"
spring-boot = "4.1.2"
openapi-generator = "7.27.0"
# JUnit follows the version managed by Spring Boot so both builds test on the same platform.
junit = "6.0.3"
jackson-databind-nullable = "0.2.13"
# Android Gradle plugin, through its Kotlin Multiplatform library plugin, for the Android target of the shared module.
agp = "9.5.1"
android-compileSdk = "36"
android-minSdk = "26"

[libraries]
jackson-databind-nullable = { module = "org.openapitools:jackson-databind-nullable", version.ref = "jackson-databind-nullable" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
kotlin-jpa = { id = "org.jetbrains.kotlin.plugin.jpa", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
openapi-generator = { id = "org.openapi.generator", version.ref = "openapi-generator" }
android-kmp-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
